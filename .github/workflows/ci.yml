name: Integración y candidato Windows
on:
  pull_request:
  push:
    branches: [main, experimental]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validar:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SIMULAR_IA: '1'
      BROWSER_CHANNEL: msedge
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Dependencias CPU y navegador
        shell: pwsh
        run: |
          python -m pip install -r requirements-ci.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force respaldo | Out-Null
          "PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Lint (ruff)
        shell: pwsh
        run: |
          python -m ruff check .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Python y versiones de fuentes
        shell: pwsh
        run: |
          node pruebas/verificar_fuentes.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s pruebas -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python verificar_versiones.py --sin-binario
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Regresión de navegador
        shell: pwsh
        run: |
          foreach ($prueba in @('borradores','editor_word','revision_word','medicos','usuarios')) {
            node "pruebas/$prueba.cjs"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Cola cifrada nativa
        shell: pwsh
        run: |
          $csc = "$env:WINDIR/Microsoft.NET/Framework64/v4.0.30319/csc.exe"
          # csc de .NET Framework interpreta '/' en fuentes como separador de opciones.
          # Join-Path conserva las rutas nativas de Windows, también con espacios.
          $salidaCola = Join-Path $PWD.Path 'respaldo\cola.exe'
          $fuenteAudios = Join-Path $PWD.Path 'cliente_codigo\Audios.cs'
          $fuentePrueba = Join-Path $PWD.Path 'pruebas\cola_audios.cs'
          $datosCola = Join-Path $PWD.Path 'respaldo\cola-datos'
          & $csc /nologo /r:System.Security.dll "/out:$salidaCola" $fuenteAudios $fuentePrueba
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $salidaCola $datosCola
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Compilar y verificar distribución aislada
        shell: pwsh
        run: |
          dotnet build cliente_codigo/Transcripcion.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item cliente_codigo/bin/Release/net48/* cliente -Recurse -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File cliente_codigo/compilar.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python verificar_versiones.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Publicar candidato probado
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cliente-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            *.py
            requirements.txt
            configuracion.ejemplo.json
            conocimiento.ejemplo/
            web/
            docs/
            CHANGELOG.md
            cliente/Transcripcion.exe
            cliente/Transcripcion.exe.config
            cliente/LEEME.txt
            cliente/*.dll
            cliente/runtimes/
