<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Estadísticas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%230F172A'/%3E%3Crect%20x='12'%20y='14'%20width='40'%20height='6'%20rx='3'%20fill='%23CBD5E1'/%3E%3Crect%20x='12'%20y='24'%20width='12'%20height='6'%20rx='3'%20fill='%23CBD5E1'/%3E%3Crect%20x='27'%20y='23'%20width='25'%20height='8'%20rx='2.5'%20fill='%23EF4444'/%3E%3Crect%20x='12'%20y='33'%20width='22'%20height='8'%20rx='2.5'%20fill='%23FACC15'/%3E%3Crect%20x='37'%20y='34'%20width='15'%20height='6'%20rx='3'%20fill='%23CBD5E1'/%3E%3Crect%20x='12'%20y='44'%20width='14'%20height='6'%20rx='3'%20fill='%23CBD5E1'/%3E%3Crect%20x='29'%20y='43'%20width='18'%20height='8'%20rx='2.5'%20fill='%232DD4BF'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('tema');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  color-scheme:light;--aviso:#8a6500;--aviso-bg:#fdf3d6;
  --bg:#f3f2ef;--panel:#fbfbfa;--hoja:#ffffff;--tx:#1d1d1b;--mu:#6d6c66;--bd:#e0dfda;--bd2:#cfcdc6;
  --ac:#1f5fbf;--ac-tx:#ffffff;--ac-suave:#e6eefb;--ok:#2e7d4f;--ok-suave:#e3f2e8;--err:#b3261e;--err-bg:#fbe9e7;
  --sombra:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);--nuevo:#1f5fbf;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;--aviso:#f0c24b;--aviso-bg:#2f2810;
  --bg:#141413;--panel:#1b1b1a;--hoja:#222220;--tx:#ebeae5;--mu:#a19f98;--bd:#33322e;--bd2:#45443f;
  --ac:#7aa7f0;--ac-tx:#0e1a2e;--ac-suave:#1c2a40;--ok:#6fcf97;--ok-suave:#173524;--err:#ff8a80;--err-bg:#3a1b18;
  --sombra:none;--nuevo:#7aa7f0;
}}
:root[data-theme=dark]{
  color-scheme:dark;--aviso:#f0c24b;--aviso-bg:#2f2810;
  --bg:#141413;--panel:#1b1b1a;--hoja:#222220;--tx:#ebeae5;--mu:#a19f98;--bd:#33322e;--bd2:#45443f;
  --ac:#7aa7f0;--ac-tx:#0e1a2e;--ac-suave:#1c2a40;--ok:#6fcf97;--ok-suave:#173524;--err:#ff8a80;--err-bg:#3a1b18;
  --sombra:none;--nuevo:#7aa7f0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:var(--tx)}
input{background:var(--panel);border:1px solid var(--bd2);border-radius:7px;padding:7px 10px;min-width:0}
input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button,.boton{background:var(--panel);border:1px solid var(--bd2);border-radius:7px;padding:6px 11px;cursor:pointer;white-space:nowrap;
  text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--tx)}
button:hover,.boton:hover{border-color:var(--ac)}
button.prim{background:var(--ac);color:var(--ac-tx);border-color:var(--ac);font-weight:600}
button.peligro{color:var(--err)}
button.peligro:hover{border-color:var(--err)}
button.chico{padding:3px 9px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
button:disabled:hover{border-color:var(--bd2)}
.ico{width:32px;height:32px;padding:0;justify-content:center;border-color:transparent;background:none}
.ico svg{width:18px;height:18px}
.ico svg.solo-claro,.ico svg.solo-oscuro{display:none}
:root[data-tema-efectivo=light] .ico svg.solo-claro,:root[data-tema-efectivo=dark] .ico svg.solo-oscuro{display:block}

header{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--bd)}
.barra{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.barra h1{font-size:17px;margin:0}
.barra .sub{color:var(--mu);font-size:12.5px}
.barra .sep{flex:1}
main{max-width:1120px;margin:0 auto;padding:18px 20px 48px;display:flex;flex-direction:column;gap:16px}

/* resumen */
.resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;box-shadow:var(--sombra);min-width:0}
.tile .et{font-size:11.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tile .v{font-weight:600;margin-top:3px;display:flex;align-items:center;gap:7px;overflow-wrap:anywhere}
.tile .d{font-size:12.5px;color:var(--mu);margin-top:1px;overflow-wrap:anywhere}
.punto{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mu)}
.punto.ok{background:var(--ok)}.punto.av{background:var(--aviso)}.punto.err{background:var(--err)}
.punto.vivo{box-shadow:0 0 0 3px var(--ok-suave)}

/* tarjetas */
.dos{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:900px){.dos{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sombra);min-width:0}
.card > .cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--bd)}
.card > .cab h2{font-size:15px;margin:0}
.card > .cab .sep{flex:1}
.card > .cab .cuenta{color:var(--mu);font-size:12.5px}
.card > .cuerpo{padding:14px 16px}
.nota{color:var(--mu);font-size:12.5px;margin:10px 0 0}
.nota code,.cod{font:12px ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--bd);padding:1px 5px;border-radius:5px}
.estado-grande{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:12px 0 0;font-size:13.5px}
.dl dt{color:var(--mu)}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.url{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.url a{color:var(--ac);font:12.5px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.explica{margin:10px 0 0;padding:9px 11px;border-radius:8px;font-size:13px;background:var(--bg);border:1px solid var(--bd)}
.explica.av{background:var(--aviso-bg);border-color:var(--aviso)}
.explica.err{background:var(--err-bg);border-color:var(--err)}

/* tabla de PC */
.tabla-env{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mu);font-size:12px;padding:9px 16px;border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--bd);vertical-align:top}
tr:last-child td{border-bottom:0}
td .pcnom{font-weight:600;white-space:nowrap}
td .sec{display:block;color:var(--mu);font-size:12px}
.etq{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:10px;border:1px solid var(--bd2);color:var(--mu);white-space:nowrap}
.etq.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-suave)}
.etq.av{color:var(--aviso);border-color:var(--aviso);background:var(--aviso-bg)}
.etq.err{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.conex{display:flex;align-items:center;gap:7px;white-space:nowrap}
.vacio{color:var(--mu);padding:18px 16px;font-size:13.5px}
.vacio b{color:var(--tx);display:block;margin-bottom:2px}

/* contraseña */
form.clave{display:flex;flex-direction:column;gap:9px;margin-top:12px}
form.clave label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
form.clave .fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.err-txt{color:var(--err);font-size:12.5px;min-height:1em}

/* registro */
.filtro{display:inline-flex;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px}
.filtro button{border:0;background:none;padding:4px 10px;border-radius:6px;font-size:12.5px;color:var(--mu)}
.filtro button[aria-pressed=true]{background:var(--panel);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--bd2)}
.eventos{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:76px 66px minmax(0,1fr);gap:4px 12px;padding:10px 16px;border-bottom:1px solid var(--bd);align-items:baseline}
.ev:last-child{border-bottom:0}
.ev .hora{font-variant-numeric:tabular-nums;color:var(--mu);font-size:12.5px;white-space:nowrap}
.ev .niv{font-size:11px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:4px;justify-self:start}
.ev.error .niv{color:var(--err);background:var(--err-bg)}
.ev.aviso .niv{color:var(--aviso);background:var(--aviso-bg)}
.ev .txt{min-width:0;overflow-wrap:anywhere}
.ev .area{font-size:11.5px;color:var(--mu);font-weight:600;margin-right:6px}
.ev.nuevo .hora{color:var(--nuevo);font-weight:600}
.ev .det{margin:3px 0 0;padding:0;list-style:none;color:var(--mu);font-size:12.5px}
.ev details{margin-top:4px;font-size:12px}
.ev summary{cursor:pointer;color:var(--mu)}
.ev pre{margin:6px 0 0;padding:8px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;overflow:auto;max-height:260px;
  font:11.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre}
.mas{padding:10px 16px}
@media (max-width:640px){.ev{grid-template-columns:62px minmax(0,1fr)}.ev .niv{grid-column:1}.ev .txt{grid-column:2;grid-row:1/span 2}
  th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5){display:none}}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;
  font-size:13.5px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;z-index:5}
#toast.err{background:var(--err);color:#fff}
.sin-conexion{display:none;background:var(--err-bg);border:1px solid var(--err);color:var(--tx);border-radius:10px;padding:10px 14px;font-size:13.5px}
.sin-conexion b{color:var(--err)}
.cargando{color:var(--mu);padding:30px 0;text-align:center}

/* páginas del panel: se cambia de una a otra en la misma pestaña */
.pestanas{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;gap:4px}
.pestanas a{border-bottom:2px solid transparent;padding:8px 12px 9px;color:var(--mu);font-weight:600;text-decoration:none;
  display:inline-flex;align-items:center;gap:6px}
.pestanas a:hover{color:var(--tx);border-color:var(--bd2)}
.pestanas a[aria-current=page]{color:var(--tx);border-color:var(--ac)}
/* estadísticas */
.est-barra{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.est-barra .sep{flex:1}
.est-barra .cuenta{color:var(--mu);font-size:12.5px}
.tile .v .grande{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.tend{font-size:12px;font-weight:600;white-space:nowrap}
.tend.mejor{color:var(--ok)}.tend.peor{color:var(--err)}.tend.igual{color:var(--mu)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.barra-c{min-width:150px;width:34%}
.barra-f{display:flex;align-items:center;gap:8px}
.barra-f .pista{flex:1;height:10px;background:var(--bg);border-radius:0 4px 4px 0;min-width:40px;position:relative}
.barra-f .relleno{position:absolute;left:0;top:0;bottom:0;background:var(--ac);border-radius:0 4px 4px 0;min-width:2px}
.barra-f .relleno.cero{min-width:0}
.barra-f .val{font-variant-numeric:tabular-nums;font-size:12.5px;min-width:46px;text-align:right}
.pct{font-variant-numeric:tabular-nums;font-weight:600}
.pct.bajo{color:var(--ok)}.pct.medio{color:var(--aviso)}.pct.alto{color:var(--err)}
tr.actual td:first-child{font-weight:600}
tr.vacia td{color:var(--mu)}
td .nom{font-weight:600;overflow-wrap:anywhere}
.mu{color:var(--mu)}
.leyenda-pct{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin:10px 0 0}
.leyenda-pct span{display:inline-flex;align-items:center;gap:5px}
.leyenda-pct i{width:9px;height:9px;border-radius:50%;display:inline-block}
/* Por médico y Por estudio van uno debajo del otro: los nombres de los estudios son largos y en media columna no se leían */
.est-dos{display:grid;grid-template-columns:1fr;gap:16px}
td .nom .parte{white-space:nowrap}
td .nom .mas-e{color:var(--mu);font-weight:400;margin-right:4px}
td.col-nom{width:100%;min-width:220px}
@media (max-width:640px){.ocultable{display:none}td.barra-c{min-width:110px}td .nom .parte{white-space:normal}td.col-nom{min-width:0}}

/* desde una PC del trabajo no se abren carpetas de la PC del servidor */
.panel-remoto [data-abrir]{display:none!important}
/* tiempos de procesamiento */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mini .tile{box-shadow:none;background:var(--bg)}
.sub-t{font-size:13px;font-weight:600;margin:16px 0 6px}
.lenta{color:var(--err);font-weight:600}
.tabla-borde{border:1px solid var(--bd);border-radius:9px;overflow-x:auto}
.tabla-borde th,.tabla-borde td{padding:8px 12px}
</style>
</head>
<body>
<header>
  <div class="barra">
    <h1>Estadísticas</h1>
    <span class="sub" id="sub">Informes guardados · solo en esta PC · se actualiza sola cada minuto</span>
    <span class="sep"></span>
    <button id="bSalirPanel" type="button" title="Vuelve a la lista de informes">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Salir del panel</button>
    <button id="bTema" class="ico" title="Cambiar entre modo claro y oscuro" aria-label="Cambiar entre modo claro y oscuro">
      <svg class="solo-claro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="solo-oscuro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    </button>
  </div>
  <nav class="pestanas" aria-label="Páginas del panel">
    <a href="/admin">Estado del servidor</a><a href="/admin/estadisticas" aria-current="page">Estadísticas</a><a href="/admin/correcciones">Correcciones</a>
  </nav>
</header>
<main>
  <div class="est-barra">
    <div class="filtro" role="group" aria-label="Período" id="periodo">
      <button data-d="7" aria-pressed="false">7 días</button><button data-d="30" aria-pressed="true">30 días</button><button data-d="90" aria-pressed="false">3 meses</button><button data-d="0" aria-pressed="false">Todo</button>
    </div>
    <span class="sep"></span>
    <span class="cuenta" id="estAct"></span>
  </div>
  <div class="sin-conexion" id="estSinCon" role="status"><b>No se pudieron leer las estadísticas.</b> <span id="estErr"></span></div>
  <div class="cargando" id="estCargando">Calculando…</div>
  <div id="estAvisos"></div>
  <section class="resumen" id="estResumen" aria-label="Resumen del período" hidden></section>

  <section class="card" aria-labelledby="tSem" id="secSem" hidden>
    <div class="cab"><h2 id="tSem">% corregido por semana</h2><span class="cuenta">de lunes a domingo</span></div>
    <div class="tabla-env" id="semanas"></div>
  </section>

  <div class="est-dos" id="filaGrupos" hidden>
    <section class="card" aria-labelledby="tMed">
      <div class="cab"><h2 id="tMed">Por médico</h2><span class="cuenta" id="medCuenta"></span></div>
      <div class="tabla-env" id="medicos"></div>
    </section>
    <section class="card" aria-labelledby="tEstu">
      <div class="cab"><h2 id="tEstu">Por estudio</h2><span class="cuenta" id="estuCuenta"></span></div>
      <div class="tabla-env" id="estudios"></div>
    </section>
  </div>

  <section class="card" aria-labelledby="tTiem" id="secTiem" hidden>
    <div class="cab"><h2 id="tTiem">Tiempos de procesamiento</h2><span class="cuenta" id="tiemCuenta"></span></div>
    <div class="cuerpo" id="tiempos"></div>
  </section>

  <section class="card" aria-labelledby="tUlt" id="secUlt" hidden>
    <div class="cab"><h2 id="tUlt">Informes del período</h2><span class="cuenta" id="ultCuenta"></span><span class="sep"></span>
      <button class="chico" data-abrir="registros" title="Abre la carpeta registros: actividad.csv tiene una fila por informe y se abre con Excel">Abrir carpeta (actividad.csv)</button></div>
    <div class="tabla-env" id="ultimos"></div>
    <div class="mas" id="ultMas" hidden><button class="chico" id="bUltMas">Ver más</button></div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const leerLS = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const grabarLS = (k, v) => { try { localStorage.setItem(k, v); } catch(e){} };
let E = null, filtro = 'todos', cuantos = 25, ultimo = {};
const VISTO_ANTES = +(leerLS('adminVisto') || 0);       // para marcar los eventos nuevos desde la última visita

/* ---------- tema (el mismo que la página de informes) */
function aplicarTema(){
  const t = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.temaEfectivo = t;
}
$('#bTema').onclick = () => {
  const t = document.documentElement.dataset.temaEfectivo === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t; grabarLS('tema', t); aplicarTema();
};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
aplicarTema();

/* ---------- utilidades */
function hace(seg){
  if(seg == null) return '';
  seg = Math.max(0, Math.round(seg));
  if(seg < 10) return 'recién';
  if(seg < 60) return `hace ${seg} s`;
  const m = Math.round(seg / 60); if(m < 60) return `hace ${m} min`;
  const h = Math.floor(seg / 3600); if(h < 24) return `hace ${h} h ${Math.round((seg % 3600) / 60)} min`;
  const d = Math.floor(seg / 86400); return d === 1 ? 'hace 1 día' : `hace ${d} días`;
}
function duracion(seg){
  const m = Math.floor(seg / 60), h = Math.floor(m / 60);
  return h ? `${h} h ${m % 60} min` : m ? `${m} min` : 'menos de 1 min';
}
const plural = (n, uno, varios) => `${n} ${n === 1 ? uno : (varios || uno + 's')}`;
function fechaCorta(s){         // "2026-10-24 23:47" -> "24/10 23:47"
  const m = /^(\d{4})-(\d\d)-(\d\d)(?: (\d\d:\d\d))?/.exec(s || ''); return m ? `${m[3]}/${m[2]}${m[4] ? ' ' + m[4] : ''}` : (s || '');
}
function fechaDe(t){ const d = new Date(t * 1000); return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'}); }
let toastT;
function toast(msg, error){
  const t = $('#toast'); t.textContent = msg; t.className = error ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', error ? 9000 : 6000);
}
async function accion(ruta, datos, boton){
  if(boton) boton.disabled = true;
  try {
    const r = await fetch('/api/admin/' + ruta, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Panel': '1'}, body: JSON.stringify(datos || {})});
    const j = await r.json().catch(() => ({}));
    if(r.status === 401 && j.entrar_panel){ location.reload(); return null; }
    if(!r.ok) throw new Error(j.error || 'Error ' + r.status);
    if(j.msg) toast(j.msg);
    cargar();
    return j;
  } catch(e){ toast(e.message, true); return null; }
  finally { if(boton) boton.disabled = false; }
}
function poner(id, html){ if(ultimo[id] !== html){ ultimo[id] = html; $(id).innerHTML = html; } }
function tile(et, punto, v, d){ return `<div class="tile"><div class="et">${et}</div><div class="v">${punto != null ? `<span class="punto ${punto}"></span>` : ''}${v}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`; }
/* ---------- usado desde una PC del trabajo (con la contraseña del panel) */
function modoRemoto(v, subNormal){
  const rem = !!(v && v.remoto);
  document.documentElement.classList.toggle('panel-remoto', rem);
  $('#bSalirPanel').title = rem ? 'Cierra la sesión del panel en esta PC y vuelve a los informes' : 'Vuelve a la lista de informes';
  $('#sub').textContent = rem ? `Desde ${v.pc} · la sesión del panel se cierra sola tras 30 min sin usarla` : subNormal;
}
$('#bSalirPanel').onclick = async () => {
  // un solo botón: desde una PC del trabajo además cierra la sesión del panel
  if(document.documentElement.classList.contains('panel-remoto'))
    try { await fetch('/api/admin/salir', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Panel': '1'}, body: '{}'}); } catch(e){}
  location.href = '/';
};
function cargar(){ cargarEst(true); }      // la usa accion() después de un botón

let S = null, estDias = +(leerLS('estDias') || 30), ultCuantos = 15, estPidiendo = false;
if(![7, 30, 90, 0].includes(estDias)) estDias = 30;
const num1 = v => v == null ? '—' : v.toLocaleString('es-AR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const ent = v => v == null ? '—' : Math.round(v).toLocaleString('es-AR');
function mmss(seg){ if(seg == null) return '—'; seg = Math.round(seg); return `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`; }
function horas(seg){
  if(!seg) return '—'; const m = Math.round(seg / 60), h = Math.floor(m / 60);
  return h ? `${h} h ${m % 60} min` : m ? `${m} min` : `${Math.round(seg)} s`;
}
function tonoPct(p){ return p == null ? '' : p < 5 ? 'bajo' : p < 15 ? 'medio' : 'alto'; }
const pctHtml = p => p == null ? '<span class="mu">—</span>' : `<span class="pct ${tonoPct(p)}">${num1(p)} %</span>`;
function diaMes(iso){ const [y, m, d] = iso.split('-'); return `${d}/${m}`; }
const HM = {hour:'2-digit', minute:'2-digit', hourCycle:'h23'};
function fechaT(t){ const d = new Date(t * 1000); return d.toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit'}) + ' ' + d.toLocaleTimeString('es-AR', HM); }
function barra(valor, max, texto, titulo){
  const w = max > 0 && valor ? Math.max(0, Math.min(100, 100 * valor / max)) : 0;
  return `<div class="barra-f" title="${esc(titulo || texto)}"><div class="pista"><div class="relleno${w ? '' : ' cero'}" style="width:${w}%"></div></div><span class="val">${texto}</span></div>`;
}
function tendencia(act, prev, menosEsMejor){
  if(act == null || prev == null) return '';
  const d = act - prev;
  if(Math.abs(d) < 0.05) return '<span class="tend igual" title="Igual que el período anterior">= igual</span>';
  const mejor = menosEsMejor ? d < 0 : d > 0;
  return `<span class="tend ${mejor ? 'mejor' : 'peor'}" title="Comparado con el período anterior (${num1(prev)} %)">${d < 0 ? '▼' : '▲'} ${num1(Math.abs(d))} pts</span>`;
}
function nombrePeriodo(d){ return d === 7 ? 'los últimos 7 días' : d === 30 ? 'los últimos 30 días' : d === 90 ? 'los últimos 3 meses' : 'todo el historial'; }

async function cargarEst(forzar){
  if(estPidiendo && !forzar) return;
  estPidiendo = true;
  try {
    const r = await fetch('/api/admin/estadisticas?dias=' + estDias, {cache: 'no-store'});
    if(r.status === 403 || r.status === 401){ location.reload(); return; }     // sesión del panel vencida: pide la contraseña
    if(!r.ok) throw new Error('el servidor respondió ' + r.status);
    S = await r.json();
    modoRemoto(S.visor, 'Informes guardados · solo en esta PC · se actualiza sola cada minuto');
    $('#estSinCon').style.display = 'none';
    armarEst();
  } catch(err){
    $('#estSinCon').style.display = 'block';
    $('#estErr').textContent = /fetch|network/i.test(err.message) ? '¿Se cerró la ventana del servidor? Se vuelve a intentar sola.' : err.message;
  } finally { estPidiendo = false; $('#estCargando').hidden = true; }
}

function armarEst(){
  const s = S, r = s.resumen, p = s.previo;
  $('#estAct').textContent = `${nombrePeriodo(s.dias)[0].toUpperCase() + nombrePeriodo(s.dias).slice(1)} · actualizado ${new Date(s.ahora * 1000).toLocaleTimeString('es-AR', HM)}`;
  const hay = r.n > 0;
  ['#estResumen', '#secSem', '#filaGrupos', '#secUlt'].forEach(id => $(id).hidden = !hay);
  armarTiempos();

  // avisos
  let av = '';
  if(!hay){
    av = s.total_historico
      ? `<div class="vacio card"><b>No hay informes guardados en ${nombrePeriodo(s.dias)}.</b>Probá con un período más largo: hay ${plural(s.total_historico, 'informe guardado', 'informes guardados')} desde el ${fechaT(s.primero).slice(0, 5)}.</div>`
      : `<div class="vacio card"><b>Todavía no hay informes guardados.</b>Las estadísticas aparecen cuando guardás el primero con «Guardar Word y aprender».</div>`;
  } else {
    const sinMed = (s.medicos.find(m => m.nombre === 'Sin especificar') || {}).n || 0;
    if(!r.rev_n) av += `<p class="explica">El <b>tiempo de revisión</b> se empezó a medir con esta versión: aparece en los informes que se guarden de ahora en adelante. Cuenta solo el tiempo con el caso abierto y trabajándolo (teclado, mouse o audio sonando); las pausas de más de un minuto no cuentan.</p>`;
    else if(r.rev_n < r.n) av += `<p class="nota">El tiempo de revisión está medido en ${r.rev_n} de ${r.n} informes (se mide desde el ${fechaT(s.rev_desde).slice(0, 5)}). Los promedios de tiempo usan solo esos.</p>`;
    if(sinMed && sinMed >= r.n / 2) av += `<p class="explica av">${sinMed} de ${r.n} informes no tienen médico. Para que la tabla <b>Por médico</b> sirva, elegí el médico en «Médico de los audios que subas» (o en cada PC del trabajo) antes de mandar los audios, o en el caso abierto antes de guardar.</p>`;
  }
  poner('#estAvisos', av);
  if(!hay) return;

  // resumen
  const tRev = r.rev_n ? `${mmss(r.rev_prom)} <span class="tend igual">min:seg</span>` : '—';
  poner('#estResumen',
    tile('Informes revisados', null, `<span class="grande">${ent(r.n)}</span>`, p ? `${ent(p.n)} en el período anterior` : (s.dias ? 'sin datos del período anterior' : `desde el ${fechaT(s.primero).slice(0, 5)}`))
    + tile('% corregido', null, `<span class="grande">${num1(r.pct)} %</span>${tendencia(r.pct, p && p.pct, true)}`, `promedio por informe · mediana ${num1(r.pct_mediana)} %`)
    + tile('Tiempo de revisión', null, `<span class="grande">${tRev}</span>`, r.rev_n ? `promedio por informe · mediana ${mmss(r.rev_mediana)}` : 'se mide desde esta versión')
    + tile('Tiempo total revisando', null, `<span class="grande">${horas(r.rev_total)}</span>`, r.rev_n ? `en ${plural(r.rev_n, 'informe medido', 'informes medidos')}` : '—')
    + tile('Palabras corregidas', null, `<span class="grande">${ent(r.corregidas)}</span>`, `de ${ent(r.palabras)} palabras en los informes`)
    + tile('Marcas por informe', null, `<span class="grande">${num1(r.marcas)}</span>`, 'promedio al generarse'));

  // semanas
  const lunesHoy = (() => { const d = new Date(s.ahora * 1000); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; })();
  const isoL = `${lunesHoy.getFullYear()}-${String(lunesHoy.getMonth() + 1).padStart(2, '0')}-${String(lunesHoy.getDate()).padStart(2, '0')}`;
  const maxPct = Math.max(10, ...s.semanas.map(w => w.pct || 0));
  const maxN = Math.max(1, ...s.semanas.map(w => w.n));
  let h = '<table><thead><tr><th scope="col">Semana</th><th scope="col">% corregido</th><th scope="col" class="ocultable">Informes</th><th scope="col" class="num">Revisión prom.</th><th scope="col" class="num ocultable">Revisión total</th></tr></thead><tbody>';
  for(const w of [...s.semanas].reverse()){
    const actual = w.desde === isoL;
    h += `<tr class="${actual ? 'actual' : ''}${w.n ? '' : ' vacia'}"><td>${diaMes(w.desde)} – ${diaMes(w.hasta)}${actual ? ' <span class="etq">esta semana</span>' : ''}</td>`
       + `<td class="barra-c">${w.n ? barra(w.pct, maxPct, `<span class="pct ${tonoPct(w.pct)}">${num1(w.pct)} %</span>`, `${num1(w.pct)} % corregido · mediana ${num1(w.pct_mediana)} %`) : '<span class="mu">sin informes</span>'}</td>`
       + `<td class="barra-c ocultable">${w.n ? barra(w.n, maxN, ent(w.n), plural(w.n, 'informe')) : ''}</td>`
       + `<td class="num">${w.rev_n ? mmss(w.rev_prom) : '<span class="mu">—</span>'}</td><td class="num ocultable">${w.rev_n ? horas(w.rev_total) : '<span class="mu">—</span>'}</td></tr>`;
  }
  poner('#semanas', h + '</tbody></table>');

  // médicos y estudios
  poner('#medicos', tablaGrupo(s.medicos, 'Médico'));
  poner('#estudios', tablaGrupo(s.estudios, 'Estudio'));
  $('#medCuenta').textContent = plural(s.medicos.length, 'médico');
  $('#estuCuenta').textContent = plural(s.estudios.length, 'combinación', 'combinaciones');

  // informes
  $('#ultCuenta').textContent = s.ultimos.length < r.n ? `los ${s.ultimos.length} más recientes de ${r.n}` : plural(r.n, 'informe');
  armarUltimos();
}


/* ---------- tiempos de procesamiento (Whisper e IA) */
const seg1 = v => v == null ? '—' : (v < 10 ? num1(v) : ent(v)) + ' s';
function tendT(act, prev){        // en tiempos, más es peor
  if(act == null || prev == null || !prev) return '';
  const d = (act - prev) / prev * 100;
  if(Math.abs(d) < 5) return '<span class="tend igual" title="Parecido al período anterior">= igual</span>';
  return `<span class="tend ${d < 0 ? 'mejor' : 'peor'}" title="Comparado con el período anterior (${seg1(prev)})">${d < 0 ? '▼' : '▲'} ${Math.round(Math.abs(d))} %</span>`;
}
function armarTiempos(){
  const T = S.tiempos, r = T && T.resumen;
  const hay = r && r.n > 0;
  $('#secTiem').hidden = !(hay || (r && r.errores));
  if($('#secTiem').hidden) return;
  const p = T.previo || {};
  $('#tiemCuenta').textContent = `${plural(r.n, 'informe generado', 'informes generados')} en ${nombrePeriodo(S.dias)}`;
  let h = '';
  // aviso si se está poniendo más lento
  const peor = [];
  if(r.ia_mediana && p.ia_mediana && r.ia_mediana > p.ia_mediana * 1.3 && r.ia_mediana - p.ia_mediana >= 5) peor.push(`la IA (mediana ${seg1(r.ia_mediana)} contra ${seg1(p.ia_mediana)})`);
  if(r.whisper_x && p.whisper_x && r.whisper_x > p.whisper_x * 1.3) peor.push(`Whisper (${num1(r.whisper_x * 60)} s por minuto de audio contra ${num1(p.whisper_x * 60)} s)`);
  if(peor.length) h += `<p class="explica av" style="margin:0 0 12px">Más lento que en el período anterior: ${peor.join(' y ')}. Puede ser la placa de video ocupada por otro programa, poca memoria libre o un modelo distinto.</p>`;
  h += '<div class="mini">'
    + tile('IA por informe', null, `<span class="grande">${seg1(r.ia_mediana)}</span>${tendT(r.ia_mediana, p.ia_mediana)}`, `mediana · promedio ${seg1(r.ia_prom)} · 9 de cada 10 en menos de ${seg1(r.ia_p90)}`)
    + tile('Whisper por minuto de audio', null, `<span class="grande">${r.whisper_x != null ? num1(r.whisper_x * 60) + ' s' : '—'}</span>${tendT(r.whisper_x, p.whisper_x)}`, `mediana · por audio ${seg1(r.whisper_mediana)} (audios de ${mmss(r.audio_prom)} en promedio)`)
    + tile('Total por audio', null, `<span class="grande">${seg1(r.total_mediana)}</span>${tendT(r.total_mediana, p.total_mediana)}`, `Whisper + IA · mediana · promedio ${seg1(r.total_prom)}`)
    + tile('Errores al procesar', r.errores ? 'err' : null, `<span class="grande">${ent(r.errores)}</span>`, r.errores ? 'ver abajo' : 'ninguno en el período')
    + '</div>';
  // por semana
  const sem = (T.semanas || []).filter(w => w.n || w.errores);
  if(sem.length > 1){
    const maxIa = Math.max(1, ...sem.map(w => w.ia_mediana || 0)), maxW = Math.max(0.01, ...sem.map(w => w.whisper_x || 0));
    h += '<div class="sub-t">Por semana</div><div class="tabla-borde"><table><thead><tr><th scope="col">Semana</th><th scope="col">IA (mediana)</th><th scope="col" class="ocultable">Whisper por min de audio</th><th scope="col" class="num">Informes</th></tr></thead><tbody>';
    for(const w of [...sem].reverse())
      h += `<tr><td>${diaMes(w.desde)} – ${diaMes(w.hasta)}</td><td class="barra-c">${w.ia_mediana ? barra(w.ia_mediana, maxIa, seg1(w.ia_mediana)) : '<span class="mu">—</span>'}</td>`
         + `<td class="barra-c ocultable">${w.whisper_x ? barra(w.whisper_x, maxW, num1(w.whisper_x * 60) + ' s') : '<span class="mu">—</span>'}</td><td class="num">${ent(w.n)}${w.errores ? ` <span class="lenta" title="errores">· ${w.errores} con error</span>` : ''}</td></tr>`;
    h += '</tbody></table></div>';
  }
  // los más lentos
  if(T.lentos.length){
    h += '<div class="sub-t">Los más lentos del período</div><div class="tabla-borde"><table><thead><tr><th scope="col">Generado</th><th scope="col">Audio</th><th scope="col" class="num">Duración</th><th scope="col" class="num">Whisper</th><th scope="col" class="num">IA</th><th scope="col" class="num">Total</th></tr></thead><tbody>';
    for(const x of T.lentos)
      h += `<tr><td style="white-space:nowrap">${fechaT(x.t)}</td><td><span class="nom">${esc(x.titulo)}</span><span class="sec">${esc(x.pc)}</span></td><td class="num">${mmss(x.dur)}</td>`
         + `<td class="num${x.whisper_lento ? ' lenta' : ''}" title="${x.whisper_x ? num1(x.whisper_x * 60) + ' s por minuto de audio' : ''}">${seg1(x.whisper)}</td>`
         + `<td class="num${x.ia_lenta ? ' lenta' : ''}">${seg1(x.ia)}</td><td class="num">${seg1((x.whisper || 0) + (x.ia || 0))}</td></tr>`;
    h += '</tbody></table></div><p class="nota">En rojo: más del doble de lo normal del período. La IA del primer informe de una tanda suele tardar algo más porque carga el modelo en la placa.</p>';
  }
  if(T.errores.length){
    h += '<div class="sub-t">Errores al procesar</div><ul class="eventos tabla-borde">' + T.errores.map(x =>
      `<li class="ev error" style="grid-template-columns:96px minmax(0,1fr)"><span class="hora">${fechaT(x.t)}</span><div class="txt"><b>${esc(x.titulo)}</b> <span class="mu">· ${esc(x.pc)}</span><ul class="det"><li>${esc(x.detalle || 'sin detalle')}</li></ul></div></li>`).join('') + '</ul>';
  }
  poner('#tiempos', h);
}

// "Mamografía + Eco mamaria" -> cada estudio en un bloque que no se corta; si no entra, pasa al renglón siguiente con su "+"
function nombreGrupo(n){
  const p = String(n ?? '').split(' + ');
  return `<span class="parte">${esc(p[0])}</span>` + p.slice(1).map(x => ` <span class="parte"><span class="mas-e">+</span>${esc(x)}</span>`).join('');
}
function tablaGrupo(filas, titulo){
  const porTiempo = S.medida === 'tiempo';
  const parte = f => f.parte;
  const max = Math.max(1, ...filas.map(f => parte(f) || 0));
  const expl = porTiempo ? 'Parte del tiempo total de revisión del período' : 'Parte de todas las palabras que hubo que corregir en el período';
  let h = `<table><thead><tr><th scope="col">${titulo}</th><th scope="col" class="num">Informes</th><th scope="col" class="num">% corregido</th><th scope="col" class="num">Revisión prom.</th><th scope="col" title="${expl}">Parte del trabajo</th></tr></thead><tbody>`;
  for(const f of filas){
    const pt = parte(f);
    const tip = `${f.nombre}: ${plural(f.n, 'informe')} · ${num1(f.pct)} % corregido · ${ent(f.corregidas)} palabras corregidas` + (f.rev_n ? ` · ${horas(f.rev_total)} de revisión` : '');
    h += `<tr><td class="col-nom"><span class="nom">${nombreGrupo(f.nombre)}</span>${f.marcas != null ? `<span class="sec">${num1(f.marcas)} marcas por informe</span>` : ''}</td>`
       + `<td class="num">${ent(f.n)}</td><td class="num">${pctHtml(f.pct)}</td><td class="num">${f.rev_n ? mmss(f.rev_prom) : '<span class="mu">—</span>'}</td>`
       + `<td class="barra-c">${pt != null ? barra(pt, max, num1(pt) + ' %', tip) : '<span class="mu">—</span>'}</td></tr>`;
  }
  return h + `</tbody></table><p class="nota" style="margin:0;padding:10px 16px">Ordenado por quién da más trabajo. <b>Parte del trabajo</b>: ${porTiempo ? 'del tiempo total de revisión' : 'de las palabras que hubo que corregir (el tiempo de revisión todavía no está medido en casi todos los informes del período)'}.</p>`;
}

function armarUltimos(){
  const s = S, lista = s.ultimos.slice(0, ultCuantos);
  let h = '<table><thead><tr><th scope="col">Guardado</th><th scope="col">Audio</th><th scope="col">Médico</th><th scope="col" class="ocultable">PC</th><th scope="col" class="num">% corregido</th><th scope="col" class="num">Revisión</th><th scope="col" class="num ocultable">Marcas</th></tr></thead><tbody>';
  for(const i of lista){
    h += `<tr><td style="white-space:nowrap">${fechaT(i.t)}</td><td><span class="nom">${esc(i.titulo)}</span><span class="sec">${esc(i.estudios)}</span></td>`
       + `<td>${i.medico === 'Sin especificar' ? '<span class="mu">sin especificar</span>' : esc(i.medico)}</td><td class="ocultable">${esc(i.pc)}</td>`
       + `<td class="num">${pctHtml(i.pct)}${i.palabras ? `<span class="sec">${ent(i.palabras)} palabras</span>` : ''}</td>`
       + `<td class="num">${i.rev ? mmss(i.rev) : '<span class="mu">—</span>'}</td><td class="num ocultable">${i.marcas != null ? ent(i.marcas) : '<span class="mu">—</span>'}</td></tr>`;
  }
  poner('#ultimos', h + '</tbody></table>' + '<div class="leyenda-pct" style="padding:0 16px 12px"><span><i style="background:var(--ok)"></i>menos de 5 %</span><span><i style="background:var(--aviso)"></i>5 a 15 %</span><span><i style="background:var(--err)"></i>15 % o más</span></div>');
  $('#ultMas').hidden = s.ultimos.length <= ultCuantos;
}
$('#bUltMas').onclick = () => { ultCuantos += 15; armarUltimos(); };

document.querySelectorAll('#periodo button').forEach(b => {
  b.setAttribute('aria-pressed', +b.dataset.d === estDias);
  b.onclick = () => {
    estDias = +b.dataset.d; grabarLS('estDias', String(estDias)); ultCuantos = 15;
    document.querySelectorAll('#periodo button').forEach(x => x.setAttribute('aria-pressed', x === b));
    cargarEst(true);
  };
});
document.querySelectorAll('[data-abrir]').forEach(b => b.onclick = () => accion('abrir', {que: b.dataset.abrir}, b));

cargarEst(true);
setInterval(() => { if(!document.hidden) cargarEst(); }, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden && S && Date.now() / 1000 - S.ahora > 60) cargarEst(); });
</script>
</body>
